[package]
name = "chereesizer"
version = "1.0.0"
description = "Resize images exactly and inspect all four edges for padding lines"
authors = ["Sampson Lewis"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
